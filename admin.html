<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tantrade Admin - Manage Gallery</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header clay-card">
            <div class="logo-area">
                <svg class="logo-icon" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="28" fill="#0A7E4B" opacity="0.1"/>
                    <path d="M15 35 L25 20 L30 28 L40 15 L45 35" stroke="#0A7E4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 40 L40 40" stroke="#0A7E4B" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="30" cy="30" r="8" stroke="#1B4F8A" stroke-width="2.5" fill="none"/>
                    <path d="M27 30 L29 32 L33 28" stroke="#0A7E4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div>
                    <h1>Tantrade Admin</h1>
                    <p>Gallery Management System</p>
                </div>
            </div>
            <a href="index.html" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                View Public Site
            </a>
        </header>

        <div class="admin-grid">
            <!-- Add Product Form -->
            <section class="clay-card form-section">
                <h2>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add New Product
                </h2>
                <form id="productForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="titleEn">Title (English)</label>
                            <input type="text" id="titleEn" required class="clay-input" placeholder="e.g., Kitenge Dress">
                        </div>
                        <div class="form-group">
                            <label for="titleSw">Title (Swahili)</label>
                            <input type="text" id="titleSw" required class="clay-input" placeholder="e.g., Gauni la Kitenge">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required class="clay-input">
                                <option value="textiles">Textiles & Fashion</option>
                                <option value="food">Food & Beverages</option>
                                <option value="crafts">Handicrafts</option>
                                <option value="agriculture">Agriculture</option>
                                <option value="manufacturing">Manufacturing</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mediaType">Media Type</label>
                            <select id="mediaType" required class="clay-input" onchange="toggleMediaInput()">
                                <option value="image">Image Upload (PNG, JPG, WEBP)</option>
                                <option value="video">Video Upload (MP4, WEBM)</option>
                                <option value="youtube">YouTube Directive Link</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" id="fileInputGroup">
                        <label for="mediaFile">Upload Media File</label>
                        <div class="clay-input file-drop-area">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            <span id="fileName">Click to select or drag file here</span>
                            <input type="file" id="mediaFile" class="file-input" accept="image/png, image/jpeg, image/webp, video/mp4, video/webm">
                        </div>
                    </div>

                    <div class="form-group" id="youtubeInputGroup" style="display: none;">
                        <label for="youtubeUrl">YouTube Video URL</label>
                        <input type="url" id="youtubeUrl" class="clay-input" placeholder="https://www.youtube.com/watch?v=...">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="descEn">Description (English)</label>
                            <textarea id="descEn" required class="clay-input" rows="3" placeholder="Product description..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="descSw">Description (Swahili)</label>
                            <textarea id="descSw" required class="clay-input" rows="3" placeholder="Maelezo ya bidhaa..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Save Product
                    </button>
                    <p id="statusMessage" class="status-message"></p>
                </form>
            </section>

            <!-- Existing Products List -->
            <section class="clay-card list-section">
                <h2>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    Current Gallery Items
                </h2>
                <div class="table-container">
                    <table class="clay-table">
                        <thead>
                            <tr>
                                <th>Media</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <tr>
                                <td colspan="4" class="loading-state">
                                    <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/></svg>
                                    Loading products...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
